name: VideoTurkmen Import and APK Build

'on':
  push:
    branches:
      - videoturkmen
    paths:
      - 'VideoTurkmen-tam-kaynak-GPL3.zip'
      - '.github/workflows/videoturkmen-import-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract source and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract VideoTurkmen source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="VideoTurkmen-tam-kaynak-GPL3.zip"
          test -s "$ARCHIVE"
          unzip -oq "$ARCHIVE" -d .
          test -f settings.gradle
          test -f app/build.gradle
          grep -q 'com.videoturkmen.app' app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Build VideoTurkmen FOSS release APK
        run: ./gradlew --no-daemon assembleFossRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoTurkmen-APK
          path: app/build/outputs/apk/foss/release/VideoTurkmen-*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
