
name: VideoTurkmen APK

'on':
  push:
    branches:
      - videoturkmen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p /tmp/vt
          unzip -q VideoTurkmen-kaynak-duzeltildi.zip -d /tmp/vt
          PROJECT=/tmp/vt/VideoTurkmen
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          rm -rf app
          rm -f build.gradle build.gradle.kts settings.gradle settings.gradle.kts
          cp -a "$PROJECT/." .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VideoTurkmen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
